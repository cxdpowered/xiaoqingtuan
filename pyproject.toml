[project]
name = "xiaoqingtuan"
version = "0.1.0"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "httpx[socks]>=0.28.1",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-wxclaw>=0.2.1",
    "nonebot-plugin-status>=0.9.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "lancedb>=0.13.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
]
search = [
    "tavily-python>=0.5.0",
]
mcp = [
    "mcp>=1.0.0",
]

[tool.uv]
# bge-small / torch are heavy and optional; install with: uv sync --extra embeddings
